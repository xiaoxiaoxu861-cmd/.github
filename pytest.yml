name: API tests

on:
  push:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: minimall_ci_password
          MYSQL_DATABASE: minimall_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pminimall_ci_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: minimall_test
      DB_USER: root
      DB_PASSWORD: minimall_ci_password
      JWT_SECRET: minimall-ci-secret
      PORT: 3000
      MINIMALL_BASE_URL: http://localhost:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Initialize test database
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password="$DB_PASSWORD" < database/schema.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --password="$DB_PASSWORD" minimall_test < database/seed.sql

      - name: Start MiniMall backend
        run: |
          npm start > backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$MINIMALL_BASE_URL" >/dev/null; then
              echo "MiniMall backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MiniMall backend did not become ready"
          tail -n 100 backend.log
          exit 1

      - name: Run API tests
        run: python -m pytest python_api_tests -m "api and not db" -v

